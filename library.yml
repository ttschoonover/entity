# Where to find modules, for presets and `entity module add NAME`.
# A source is only where to look: a decision records the digest of the exact
# code it approved, and nothing else is ever installed.
#
# Set where modules are published, usually a GitHub repository, once:
#   entity module source github:YOU/entity-modules@main
# which writes a line here:
#   from: github:YOU/entity-modules@main
# `entity module add NAME` then fetches NAME/ from it, pinned to the commit the
# branch points at, and that pinned source is what the proposal records.
#
# A module listed below comes from where it says instead:
#   NAME: github:OWNER/REPO/SUBDIR@COMMIT   (or @BRANCH, pinned when fetched)
#   NAME: git:URL#SUBDIR@REF
#   NAME: rad:RID/SUBDIR@COMMIT
#   NAME: dir:PATH
#   NAME: pack:NAME                          a module pack on this computer
#
# With no "from" line, modules come from a pack on this computer
# (../entity-modules, or the library/ folder of this installation).

modules: {}
