_: The Orchard General Partnership, an investment club organized as a California
   general partnership in Berkeley. Every partner decides every trade, by a
   majority of the partners and of the units; the Treasurer and the Secretary
   are elected; every partner must take part; the record is sealed, so only
   partners can read it; two-factor sign-in and sealed notifications.

modules: [page, deliberation, titles, vocabulary, passwords, twofactor, offices, elections, authority,
          shares, wiki, agreements, finality, partnership, meetings, polls, docs, chat, fund,
          notify, participation, invites, details]

rules:
  joint:       { quorum: 0.5, threshold: 0.5, readings: 1, concurrent: "shares:units" }
  associate:   { quorum: 0.5, threshold: 0.6, readings: 1, concurrent: "shares:units" }
  joint-super: { quorum: 0.5, threshold: 0.6666, readings: 1, concurrent: "shares:units" }
order: [ordinary, joint, associate, organic, joint-super, constitutional, entrenched]

set:
  entity.name: The Orchard General Partnership
  vocabulary.participant: partner
  vocabulary.participants: partners
  vocabulary.assembly: Partners' Meeting
  vocabulary.proposal: resolution
  # Privacy: the record is sealed (only partners read it), never public.
  records.sealing: true
  docs.public_allowed: false
  # Admission: apply, sign the agreement, be admitted by joint resolution.
  membership.admission: decision
  membership.admission_rule: joint
  membership.removal_rule: joint
  agreements.required: [partnership-agreement]
  agreements.drawn_signature: required
  wiki.enact_rule: joint-super
  # Personal invitations, and the particulars the law needs (sealed to the officers).
  invites.max_days: 30
  details.required: true
  details.readers: [treasurer, secretary]
  # Every trade is a joint resolution of all partners; never delegated.
  fund.trade_rule: joint
  fund.max_members: 99
  deliberation.period: 7
  partnership.join_rule: associate
  partnership.profits_rule: joint
  partnership.assets_rule: joint-super
  # Officers: Treasurer and Secretary, elected separately, never the same person.
  elections.incompatible: [[treasurer, secretary]]
  finality.signers: "office:secretary"
  # Notices: trades to vote on, reminders before votes close, decisions.
  notify.events: [trades, proposals, reminders, decisions, members, notices]
  notify.remind_hours: 24
  notify.broadcast: members
  notify.plaintext_email: false
  # Participation: vote on 3 of every 4 resolutions; attend half the meetings.
  participation.min_votes: 0.75
  participation.window_votes: 8
  participation.min_meetings: 0.5
  participation.window_meetings: 4
  participation.grace_days: 30
  participation.cure_days: 30
  chat.channels:
    - { id: partners, title: Partners, about: "The partnership's business, between meetings.", read: members, post: members }
    - { id: research, title: Research, about: "Stock studies and ideas before they become resolutions.", read: members, post: members }
  amendment.rules.constitutional.readings: 1
  amendment.rules.constitutional.apart: 0
  amendment.rules.entrenched.readings: 1
  amendment.rules.entrenched.apart: 0

note: >
  Used by make-orchard-gp.sh, which also writes the partnership agreement
  (presets/orchard-gp-agreement.md) and the legal register
  (presets/orchard-gp-legal.md). Neither is legal advice.
