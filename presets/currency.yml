_: A unit of account anyone can hold and send, verifiable by anyone with a copy.
   The founder issues the supply, then freezes the entity so its rules can never
   change again. Experimental: see the note before relying on it.

modules: [deliberation, value]

set:
  entity.name: The Currency
  decision.electorate: founder
  membership.admission: open
  value.name: coins
  value.transferable: true

note: >
  To finish: issue the supply by decision (entity propose --effects
  '[{"kind":"value.issue","to":"p-0001","amount":1000000}]'), optionally set
  value.max_supply, then set decision.electorate to "none" (entrenched: two
  readings 30 days apart). Once frozen, nothing can be decided again: no
  issuance, no rule change, ever. Anyone can open an account by applying with a
  key and send coins they hold. ON ITS OWN THIS DOES NOT stop a holder from
  signing two transfers of the same coins to two different copies. Add the
  finality module before freezing (docs/MODULES.md, Finality): with validators
  signing checkpoints, a payment is final once a final checkpoint covers it,
  and a double spend is refused when copies meet. Without it, treat a payment
  as final only when the copies you trust agree on it. Issuing something used as money can bring securities and
  money-transmission law into play: take advice before offering it publicly.
