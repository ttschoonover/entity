_: A micronation. Anyone may become a citizen; citizens choose their names;
   the constitution changes only by two readings a month apart.

modules: [page, deliberation, titles, vocabulary]

set:
  entity.name: The Republic
  vocabulary.participant: citizen
  vocabulary.participants: citizens
  vocabulary.assembly: Assembly of Citizens
  vocabulary.proposal: bill
  membership.admission: open
  deliberation.period: 14

note: >
  Citizenship is open and takes effect when recorded. Renaming the republic
  or changing the charter is constitutional: half must vote, two thirds of
  the decisive votes must agree, twice, thirty days apart.
