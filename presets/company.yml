_: A private company run by its partners. One partner one vote; admitting a
   partner needs two thirds; every checkpoint needs two partners to sign.

modules: [deliberation, titles, vocabulary]

set:
  entity.name: The Company
  vocabulary.participant: partner
  vocabulary.participants: partners
  vocabulary.assembly: Partners' Meeting
  vocabulary.proposal: resolution
  membership.admission: decision
  membership.admission_rule: organic
  deliberation.period: 7
  amendment.rules.ordinary.quorum: 0.50

awaiting: [units, instruments, allocation, exchange, roles]

note: >
  This keeps the partners' decisions verifiable. It does not register a legal
  company, and shares, equity and dividends need modules not built yet.
