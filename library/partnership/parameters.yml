parameters:
  partnership.associations:
    value: true
    type: boolean
    changed_by: constitutional
    group: Partnership
    describe: Whether the partnership may join associations and grant them claims on its profits or assets. Off, joining and new claims are refused and the associations are not shown.
  partnership.join_rule:
    value: organic
    type: rule
    changed_by: constitutional
    group: Partnership
    describe: The rule under which the partnership joins or leaves an association. The partnership preset sets a concurrent rule, 60% of the partners and 60% of the units.
  partnership.profits_rule:
    value: organic
    type: rule
    changed_by: constitutional
    group: Partnership
    describe: The rule under which an association is granted, or loses, a claim to the partnership's profits. The partnership preset sets a majority of the partners and a majority of the units.
  partnership.assets_rule:
    value: constitutional
    type: rule
    changed_by: constitutional
    group: Partnership
    describe: The rule under which an association is granted, or loses, a claim to the partnership's assets. The partnership preset sets two thirds of the partners and two thirds of the units.
  partnership.unit_class:
    value: units
    type: string
    changed_by: constitutional
    group: Partnership
    describe: The share class whose units measure each partner's interest, shown on partnership certificates.
  partnership.ein:
    value: ""
    type: string
    changed_by: constitutional
    group: Partnership
    describe: The partnership's federal Employer Identification Number (NN-NNNNNNN), as the IRS issued it. The partnership's own number, used on its returns and accounts; partners' own tax numbers are never kept on the record.
  partnership.office:
    value: ""
    type: string
    changed_by: organic
    group: Partnership
    describe: The partnership's principal office (city, county and state, or a mailing address), as given on its fictitious business name statement and tax returns.
