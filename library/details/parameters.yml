parameters:
  details.required:
    value: false
    type: boolean
    changed_by: organic
    group: Partner details
    describe: Whether an applicant must give their particulars (legal name, date of birth, residence, contact, tax status, and a taxpayer number if details.tin is on) before an invitation admits them. They are encrypted to the partner and the officers in details.readers, and kept off the record.
  details.tin:
    value: true
    type: boolean
    changed_by: organic
    group: Partner details
    describe: Whether partners give a taxpayer identification number (SSN, ITIN or foreign TIN) with a Form W-9 certification. Off, the form never asks for one and none is kept; the Treasurer then collects taxpayer numbers another way when the returns need them.
  details.readers:
    value: [treasurer, secretary]
    type: list
    changed_by: organic
    group: Partner details
    describe: The offices whose holders can read partners' particulars, for the partnership's tax returns, registrations and accounts. When a holder changes, a reader who can already open them shares them with the new one (Partner details tab).
