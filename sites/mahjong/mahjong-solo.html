<meta name="description" content="Hong Kong mahjong against three AIs. One file, no internet needed.">
<style>:root{--sans:system-ui,-apple-system,"Segoe UI",sans-serif;--serif:Georgia,serif;--wrap:72rem;--gutter:1.25rem}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:1rem/1.55 var(--sans);color:var(--ink)}
h1{font:600 clamp(2.6rem,7vw,4.5rem)/1 var(--serif);margin:0 0 .6rem}.lede{font-size:1.15rem;max-width:34em}.fine{color:var(--muted);font-size:.9rem}
label{display:block;font-weight:600;margin:.8rem 0 .25rem}label.check{display:flex;gap:.5rem;font-weight:400}

/* site.css · the mahjong world: a rosewood table with a lacquer finish, ivory
   tiles on jade backs, brass for what matters. The kit's stylesheet first,
   then this. Tiles carry real faces: 萬 筒 索, 東 南 西 北, 中 發 白, in the
   colours of a printed set. */


:root {
  --bg: #1F0E0A; --surface: #2C1510; --ink: #F3EBDD; --muted: #CDBBA7; --rule: #4A271E; --strong-rule: #F3EBDD;
  --wood: #4A1C14; --wood-2: #3A150F; --lacquer: #2A100B; --brass: #D2A852; --brass-2: #A47F33;
  --ivory: #FBF6EA; --ivory-2: #EBE1CB; --jade: #2E7D5B; --jade-2: #1F5C42;
  --cn-red: #B3261E; --cn-green: #1E6B3A; --cn-blue: #1F4E9C; --cn-ink: #1B1714; --cn-plum: #7A2E6E;
  --aye: #7FCB9B; --no: #F08A7E; --accent: var(--brass);
  /* The table's own tokens: each look in the themes section below redefines them. */
  --felt-hi: #5A2418; --grain: rgba(0,0,0,.05); --table-ink: #F3EBDD; --table-muted: #E7D6BC; --table-dim: #CDBBA7;
  --tray: rgba(0,0,0,.2); --brass-soft: rgba(210,168,82,.28); --on-brass: #22100B; --win: var(--cn-red); --win-edge: #E2574C;
  --panel: #3A160F; --panel-2: #2A100B; --overlay: rgba(15,6,4,.62); --plus: #8FD9A8; --minus: #F4A094;
  --table-radius: 18px; --tile-radius: 6px; --tile-border: 0; --table-glow: 0 18px 40px rgba(0,0,0,.45);
  --tile-font: "Noto Serif CJK TC", "Noto Serif TC", "Songti TC", "STSong", "PMingLiU", "MingLiU", "Source Han Serif TC", serif;
  color-scheme: dark;
}
/* The kit's dark palette is set under these selectors; the rosewood one must be too, or the kit's wins. */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1F0E0A; --surface: #2C1510; --ink: #F3EBDD; --muted: #CDBBA7; --rule: #4A271E; --strong-rule: #F3EBDD; --aye: #7FCB9B; --no: #F08A7E; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #1F0E0A; --surface: #2C1510; --ink: #F3EBDD; --muted: #CDBBA7; --rule: #4A271E; --strong-rule: #F3EBDD; --aye: #7FCB9B; --no: #F08A7E; color-scheme: dark; }
:root[data-theme="light"] { --bg: #F4EDE0; --surface: #EADFCB; --ink: #2A140F; --muted: #6B5246; --rule: #D9C9AF; --strong-rule: #2A140F; --aye: #1E6B3A; --no: #B3261E; color-scheme: light; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #F4EDE0; --surface: #EADFCB; --ink: #2A140F; --muted: #6B5246; --rule: #D9C9AF; --strong-rule: #2A140F; --aye: #1E6B3A; --no: #B3261E; color-scheme: light; } }

body { background: var(--bg); }
.masthead { background: var(--bg); box-shadow: inset 0 -1px 0 var(--rule), inset 0 -3px 0 var(--brass-2); }
.primary, .hall-view button:not(.linklike):not(.quiet):not(.danger):not(.secondary) { background: var(--brass); border-color: var(--brass); color: var(--on-brass); }
.secondary { border-color: var(--brass); color: var(--ink); }
.tabs a[aria-current] { box-shadow: inset 0 -3px 0 var(--brass); }
h1, h2 { letter-spacing: -0.02em; }
h1[data-name="full"] { font-family: var(--serif); font-weight: 600; font-size: clamp(3.4rem, 9vw, 6.5rem); }

/* ── the front page ─────────────────────────────────────────────────────── */
.mj-hero { max-width: var(--wrap); margin: 0 auto; padding: 4rem var(--gutter) 4.5rem; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 2rem; align-items: center; }
@media (max-width: 52rem) { .mj-hero { grid-template-columns: 1fr; } }
.mj-fan { position: relative; height: 15rem; display: flex; justify-content: center; align-items: flex-end; }
.mj-fan .tile { --w: 4.2rem; position: absolute; bottom: 2rem; left: calc(50% - 2.1rem); transform-origin: 50% 230%; transform: rotate(calc(var(--i) * 11deg)); }
.mj-doors { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; }
.mj-doors li { background: var(--surface); border: 1px solid var(--rule); border-top: 3px solid var(--brass); border-radius: 6px; padding: 1.1rem 1.2rem; }
.mj-doors p { color: var(--muted); font-size: .95rem; }
.mj-mini, .mj-standings { list-style: none; padding: 0; margin: 0; }
.mj-mini li, .mj-standings li { padding: .5rem 0; border-bottom: 1px solid var(--rule); }
.mj-standings { counter-reset: n; } .mj-standings li { counter-increment: n; }
.mj-standings li::before { content: counter(n); display: inline-grid; place-items: center; width: 1.7rem; height: 1.7rem; margin-right: .6rem; border-radius: 50%; background: var(--brass); color: #22100B; font-weight: 800; font-size: .85rem; }

/* ── tiles ──────────────────────────────────────────────────────────────── */
.tile { --w: 2.45rem; position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: .05em;
  width: var(--w); height: calc(var(--w) * 1.38); padding: 0; margin: 0 1px; border: var(--tile-border); border-radius: var(--tile-radius); flex: none;
  background: linear-gradient(180deg, var(--ivory) 0%, var(--ivory-2) 100%); box-shadow: 0 3px 0 var(--jade), 0 5px 0 var(--jade-2), 0 6px 10px rgba(0,0,0,.35);
  font: 600 calc(var(--w) * .5)/1 var(--tile-font); color: var(--cn-ink); vertical-align: bottom; transition: transform .12s; }
.tile .t-top { font-size: 1em; line-height: 1; }
.tile .t-bot { font-size: .72em; line-height: 1; }
.tile.small { --w: 1.7rem; margin: 0 1px 6px; }
.tile.back { background: var(--back-pattern, none), linear-gradient(160deg, var(--jade) 0%, var(--jade-2) 100%); box-shadow: inset 0 0 0 2px rgba(255,255,255,.08), 0 3px 0 var(--ivory-2), 0 6px 10px rgba(0,0,0,.35); }
.s-m .t-top { color: var(--cn-ink); } .s-m .t-bot { color: var(--cn-red); }
.s-p .t-top, .s-p .t-bot { color: var(--cn-blue); }
.s-s .t-top, .s-s .t-bot { color: var(--cn-green); }
.s-z .t-top { color: var(--cn-ink); }
.s-zC .t-top { color: var(--cn-red); } .s-zF .t-top { color: var(--cn-green); }
.s-zP .t-top { color: var(--cn-blue); outline: 2px solid var(--cn-blue); outline-offset: 3px; border-radius: 2px; font-size: .8em; }
.s-f .t-top, .s-g .t-top { color: var(--cn-plum); } .s-f .t-bot, .s-g .t-bot { color: var(--cn-plum); font-family: var(--sans); font-size: .5em; }
button.tile { cursor: pointer; }
button.tile:hover { transform: translateY(-4px); }
button.tile:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
.tile.selected { transform: translateY(-12px); box-shadow: 0 0 0 3px var(--brass), 0 3px 0 var(--jade), 0 5px 0 var(--jade-2), 0 14px 16px rgba(0,0,0,.4); }
.tile.dim { opacity: .38; }
.tile.last { box-shadow: 0 0 0 3px var(--brass), 0 3px 0 var(--jade), 0 6px 10px rgba(0,0,0,.35); }

/* ── the table ──────────────────────────────────────────────────────────── */
.mj-page main { padding-bottom: 2rem; }
.mj-game { max-width: 82rem; margin: 0 auto; padding: 1.2rem var(--gutter) 0; }
.mj-topline { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: .8rem; }
.mj-tabletitle { font-size: 1.6rem; margin: 0; }
.mj-table { display: grid; grid-template-columns: minmax(8rem, 1fr) minmax(0, 3.4fr) minmax(8rem, 1fr); grid-template-areas: "top top top" "left mid right" "me me me"; gap: .8rem;
  padding: 1rem; border-radius: var(--table-radius); color: var(--table-ink);
  background: radial-gradient(ellipse at 50% 40%, var(--felt-hi) 0%, var(--wood) 55%, var(--wood-2) 100%), repeating-linear-gradient(95deg, var(--grain) 0 3px, transparent 3px 9px);
  box-shadow: inset 0 0 0 3px var(--brass-2), inset 0 0 0 6px var(--lacquer), var(--table-glow); }
.mj-seat { min-width: 0; }
.mj-seat.pos-2 { grid-area: top; text-align: center; }
.mj-seat.pos-3 { grid-area: left; }
.mj-seat.pos-1 { grid-area: right; text-align: right; }
.mj-me { grid-area: me; }
.mj-mid { grid-area: mid; display: grid; gap: .6rem; padding: .8rem; border-radius: 12px; background: var(--tray); box-shadow: inset 0 0 0 1px var(--brass-soft); }
.mj-ponds-row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: .8rem; align-items: center; }
.mj-pond { display: flex; flex-wrap: wrap; align-content: flex-start; min-height: 2.6rem; gap: 0; }
.mj-pond.pos-2 { justify-content: center; } .mj-pond.pos-0 { justify-content: center; }
.mj-pond.pos-1 { justify-content: flex-end; }
.mj-center { display: grid; gap: .5rem; justify-items: center; text-align: center; padding: .6rem 1rem; border-radius: 10px; background: var(--lacquer); box-shadow: inset 0 0 0 1px var(--brass-2); min-width: 9rem; }
.mj-center span { font-size: .78rem; color: var(--table-muted); }
.mj-big { display: block; font: 600 1.8rem/1 var(--tile-font) !important; color: var(--brass) !important; }
.mj-round, .mj-left, .mj-lastd { display: grid; justify-items: center; gap: .2rem; }
.mj-name { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin-bottom: .35rem; font-size: .92rem; }
.mj-seat.pos-2 .mj-name { justify-content: center; } .mj-seat.pos-1 .mj-name { justify-content: flex-end; }
.mj-wind { display: inline-grid; place-items: center; width: 1.7rem; height: 1.7rem; border-radius: 4px; background: var(--ivory); color: var(--cn-ink); font: 600 1rem/1 var(--tile-font); box-shadow: 0 2px 0 var(--jade); }
.mj-who { font-weight: 600; }
.mj-lvl { color: var(--table-dim); font-weight: 400; font-size: .82rem; }
.mj-dealer { display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--cn-red); color: #fff; font: 600 .85rem/1 var(--tile-font); }
.mj-score { margin-left: auto; font: 700 .95rem var(--sans); color: var(--brass); font-variant-numeric: tabular-nums; }
.mj-seat.pos-2 .mj-score, .mj-seat.pos-1 .mj-score { margin-left: .4rem; }
.mj-thinking { font-size: .75rem; color: var(--table-dim); font-style: italic; }
.mj-seat.turn .mj-name .mj-who { color: var(--brass); }
.mj-seat.turn .mj-name::before { content: ""; width: .55rem; height: .55rem; border-radius: 50%; background: var(--brass); box-shadow: 0 0 0 4px var(--brass-soft); }
.mj-melds { display: flex; flex-wrap: wrap; gap: .5rem; min-height: .5rem; margin-bottom: .4rem; }
.mj-seat.pos-2 .mj-melds { justify-content: center; } .mj-seat.pos-1 .mj-melds { justify-content: flex-end; }
.mj-meld { display: inline-flex; padding: 3px 4px 0; border-radius: 6px; background: var(--tray); }
.mj-meld.bonus { background: rgba(122,46,110,.25); }
.mj-hand { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0; min-height: 2.6rem; }
.mj-seat.pos-2 .mj-hand { justify-content: center; } .mj-seat.pos-1 .mj-hand { justify-content: flex-end; }
.mj-seat.pos-0 .mj-hand { justify-content: center; padding-top: 14px; }
.mj-seat.pos-0 .tile:not(.small) { --w: clamp(2.2rem, 5.2vw, 3.3rem); }
.mj-gap { width: .9rem; }
.mj-me { padding-top: .4rem; border-top: 1px solid var(--brass-soft); }
.mj-me .mj-name { justify-content: center; }
.mj-me .mj-melds { justify-content: center; }
.mj-bar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .5rem; min-height: 3.2rem; margin-top: .9rem; }
.mj-prompt { color: var(--table-muted); font-size: .95rem; }
.mj-timer { font: 700 .9rem var(--sans); color: var(--brass); padding: .2rem .5rem; border: 1px solid var(--brass-2); border-radius: 999px; font-variant-numeric: tabular-nums; }
.mj-act { font: 600 .95rem/1 var(--sans); padding: .75rem 1.15rem; border-radius: 6px; border: 1.5px solid var(--brass); background: transparent; color: var(--table-ink); cursor: pointer; }
.mj-act:hover { background: var(--brass-soft); }
.mj-act:disabled { opacity: .45; cursor: default; }
.mj-act.a-win { background: var(--win); border-color: var(--win-edge); color: #fff; font-size: 1.05rem; }
.mj-act.a-pung, .mj-act.a-kong, .mj-act.a-chow { background: var(--brass); color: var(--on-brass); }
.mj-act.a-discard { border-style: dashed; }
.mj-empty { color: var(--muted); padding: 3rem 0; text-align: center; }
@media (max-width: 52rem) {
  .mj-table { grid-template-columns: 1fr 1fr; grid-template-areas: "top top" "left right" "mid mid" "me me"; }
  .mj-ponds-row { grid-template-columns: 1fr; }
  .mj-seat.pos-1 { text-align: left; } .mj-seat.pos-1 .mj-name, .mj-seat.pos-1 .mj-melds, .mj-seat.pos-1 .mj-hand, .mj-pond.pos-1 { justify-content: flex-start; }
  .tile.small { --w: 1.35rem; }
}

/* ── the end of a hand ──────────────────────────────────────────────────── */
#result:not([hidden]) { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 1rem; background: var(--overlay); }
.mj-result { width: min(40rem, 100%); max-height: calc(100vh - 2rem); overflow: auto; padding: 1.5rem 1.6rem; border-radius: 14px; color: var(--table-ink);
  background: linear-gradient(180deg, var(--panel), var(--panel-2)); box-shadow: inset 0 0 0 2px var(--brass-2), 0 24px 60px rgba(0,0,0,.5); }
.mj-result h2 { color: var(--brass); }
.mj-win-hand { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .4rem; margin: .8rem 0 1rem; }
.mj-faan, .mj-pay { width: 100%; list-style: none; padding: 0; margin: 0 0 1rem; border-collapse: collapse; }
.mj-faan li { display: flex; justify-content: space-between; padding: .3rem 0; border-bottom: 1px dotted var(--brass-soft); }
.mj-faan li.total { font-weight: 800; color: var(--brass); border-bottom: 0; }
.mj-pay td { padding: .3rem .4rem; border-bottom: 1px solid var(--brass-soft); font-variant-numeric: tabular-nums; }
.mj-pay td:nth-child(2), .mj-pay td:nth-child(3) { text-align: right; }
.mj-pay .plus { color: var(--plus); font-weight: 700; } .mj-pay .minus { color: var(--minus); }
.mj-verified { font-size: .88rem; padding: .6rem .8rem; border-radius: 8px; background: var(--tray); border: 1px solid var(--brass-2); }
.mj-final { font-weight: 700; }
.mj-after { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-top: 1rem; }
.mj-after p { flex-basis: 100%; margin: 0; }

/* ── setup, lobby, waiting room ─────────────────────────────────────────── */
.mj-setup { max-width: 40rem; margin: 0 auto; padding: 3rem var(--gutter); }
.mj-form { display: grid; gap: .3rem; }
.mj-form select, .mj-form input:not([type=checkbox]):not([type=radio]) { font: inherit; padding: .55rem .7rem; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); }
.mj-form fieldset { border: 1px solid var(--rule); border-radius: 8px; padding: .6rem .9rem; margin: .8rem 0; }
.mj-mix { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: .5rem; margin-top: .5rem; }
.mj-mix label { margin: 0; font-weight: 400; display: grid; gap: .25rem; }
.mj-lobby { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 2.5rem; }
@media (max-width: 52rem) { .mj-lobby { grid-template-columns: 1fr; } }
.mj-tablelist { list-style: none; padding: 0; margin: 0; display: grid; gap: .8rem; }
.mj-tablecard { background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--brass); border-radius: 8px; padding: .9rem 1.1rem; }
.mj-tablecard.st-over { border-left-color: var(--rule); }
.mj-seats { list-style: none; padding: 0; margin: .4rem 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .3rem .8rem; }
.mj-seats.big { grid-template-columns: 1fr; gap: .6rem; margin: 1.2rem 0; }
.mj-seats.big li { display: flex; align-items: center; gap: .5rem; font-size: 1.05rem; }
.mj-waiting { max-width: 38rem; margin: 1rem auto; padding: 1.4rem 1.6rem; border-radius: 14px; background: var(--surface); border: 1px solid var(--rule); }
.mj-share input { width: 100%; font: .85rem ui-monospace, Menlo, monospace; padding: .5rem; border-radius: 6px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); }
.mj-stats { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1.2rem; }
.mj-stats dt { color: var(--muted); } .mj-stats dd { margin: 0; font-weight: 600; }

/* ── looks: html[data-mj-theme], chosen with the picker, kept in a cookie (theme.js) ──
   Each is a different design, not a palette: its own type, shapes, tile faces,
   table and page. Traditional is the default (no attribute). */
.tile .t-lat, .tile .t-sub { display: none; }

/* ── Traditional: rosewood, a carved double frame, seal-stamp winds, bone tiles on bamboo ── */
:root:not([data-mj-theme]) .mj-table, :root[data-mj-theme="traditional"] .mj-table {
  box-shadow: inset 0 0 0 3px var(--brass-2), inset 0 0 0 7px var(--lacquer), inset 0 0 0 9px var(--brass-2), 0 18px 40px rgba(0,0,0,.45); padding: 1.3rem; }
:root:not([data-mj-theme]) .mj-wind, :root[data-mj-theme="traditional"] .mj-wind { background: var(--cn-red); color: #FBEFD9; border-radius: 3px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
:root:not([data-mj-theme]) .tile, :root[data-mj-theme="traditional"] .tile { box-shadow: 0 3px 0 #EDE3CC, 0 6px 0 var(--jade), 0 8px 0 var(--jade-2), 0 9px 12px rgba(0,0,0,.4); }

/* ── Minimal: quiet, light, flat. Latin faces, no frames, no shadows, lots of room ── */
:root[data-mj-theme="minimal"] {
  --bg: #FAFAF8; --surface: #F2F2EF; --ink: #1F1F1D; --muted: #8A8A84; --rule: #E6E6E1; --strong-rule: #1F1F1D;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif; --serif: var(--sans); color-scheme: light;
  --wood: #FAFAF8; --wood-2: #FAFAF8; --felt-hi: #FAFAF8; --lacquer: #FAFAF8; --grain: transparent; --brass: #1F1F1D; --brass-2: #E6E6E1; --on-brass: #FFFFFF;
  --table-ink: #1F1F1D; --table-muted: #8A8A84; --table-dim: #A6A6A0; --tray: transparent; --brass-soft: #E6E6E1;
  --ivory: #EFEFEB; --ivory-2: #EFEFEB; --jade: #DADAD4; --jade-2: #DADAD4; --panel: #FFFFFF; --panel-2: #FFFFFF; --overlay: rgba(250,250,248,.82);
  --plus: #2F7D4F; --minus: #B23A30; --win: #1F1F1D; --win-edge: #1F1F1D; --table-radius: 0; --tile-radius: 8px; --table-glow: none;
  --cn-red: #C2453A; --cn-green: #3F8A5C; --cn-blue: #3F64A8; --cn-ink: #1F1F1D;
}
:root[data-mj-theme="minimal"] body { font-weight: 300; }
:root[data-mj-theme="minimal"] h1, :root[data-mj-theme="minimal"] h2 { font-weight: 300; letter-spacing: -0.02em; }
:root[data-mj-theme="minimal"] h1[data-name="full"] { font: 200 clamp(3.2rem, 9vw, 6rem)/1 var(--sans); }
:root[data-mj-theme="minimal"] .masthead { box-shadow: none; border-bottom: 1px solid var(--rule); }
:root[data-mj-theme="minimal"] .primary, :root[data-mj-theme="minimal"] .secondary, :root[data-mj-theme="minimal"] .mj-act { border-radius: 999px; font-weight: 400; }
